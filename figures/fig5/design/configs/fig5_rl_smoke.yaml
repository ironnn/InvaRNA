mode: smoke_only
task: ngf_synonymous_cds
seed: 1234
source_implementation:
  environment: figures/fig5/design/source/env_sequence.py
  ppo: figures/fig5/design/source/agent_ppo.py
reference_sequence: assets/sequences/ngf_wt.fa
objectives:
  te_weight: 0.70
  half_life_weight: 0.30
evaluator:
  type: deterministic_smoke_proxy
  warning: >-
    This CPU-safe evaluator validates integration only. It is not a substitute for
    the frozen InvaRNA TE/half-life checkpoints and does not reproduce manuscript scores.
ppo:
  max_steps_per_episode: 4
  rollout_steps: 16
  updates: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  learning_rate: 3.0e-4
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  max_gradient_norm: 0.5
  epochs: 1
  minibatch_size: 8
  model_width: 16
checks:
  - environment_rollout
  - te_half_life_reward
  - gae
  - actor_critic_update
  - checkpoint_save_load
  - start_stop_preserved
  - protein_translation_preserved
  - csv_fasta_export
