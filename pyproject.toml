[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarna"
version = "0.1.0"
description = "RNA representation learning and translation-efficiency modeling"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=12",
  "torch>=2.2",
  "pytorch-lightning>=2.0,<3",
  "transformers>=4.30,<5",
  "omegaconf>=2.3",
  "mamba-ssm>=1.2",
  "causal-conv1d>=1.2",
  "timm>=0.9",
  "einops>=0.7",
  "tqdm>=4.65",
  "PyYAML>=6.0",
  "biopython>=1.81",
  "orffinder==1.8",
  "lightgbm",
  "pyfastx>=2.0",
  "pysam>=0.22",
  "python-codon-tables>=0.1",
  "matplotlib>=3.7",
  "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["invarna*"]
