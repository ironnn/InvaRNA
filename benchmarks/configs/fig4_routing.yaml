model: final_tdc
experts: [Single Base, Codon, 9-mer, Ribosome]
fixed_frame: {cds_start: 1000, total_length: 10000}
fig4a:
  sample_per_condition: 1000
  permutations_per_element: 20
  random_seed: 42
  production_shards: 2
  seed_per_shard: 42
  null: shuffle_only_annotated_element_interval
  region_score: mean_gate_fwd_softmax_over_element_interval
