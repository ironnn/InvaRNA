  random_seed: 99
  production_shards: 2
  seed_rule: random_seed_plus_shard_index
  null: shuffle_entire_3UTR
  scoring_region: entire_3UTR
  ranking_expert: Ribosome
fig4b_case_study:
  permutations_per_gene: 1000
